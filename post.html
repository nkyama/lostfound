
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>落とし物を投稿</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>落とし物を投稿</h1>
    </header>

    <main>
        <a href="index.html">← トップページに戻る</a>

        <form id="post-form">
            <p>
                <label>落とし物名</label><br>
                <input type="text" id="title" placeholder="例：黒い傘" required>
            </p>

            <p>
                <label>発見場所</label><br>
                <input type="text" id="location" placeholder="例：中央図書館" required>
            </p>

            <p>
                <label>発見日時</label><br>
                <input type="date" id="found-date" required>
            </p>

            <p>
                <label>カテゴリ</label><br>
                <select id="category" required>
                    <option value="傘">傘</option>
                    <option value="財布">財布</option>
                    <option value="学生証">学生証</option>
                    <option value="文房具">文房具</option>
                    <option value="電子機器">電子機器</option>
                    <option value="その他">その他</option>
                </select>
            </p>

            <p>
                <label>詳細説明</label><br>
                <textarea id="description" rows="5" cols="40"></textarea>
            </p>

            <p>
                <label>写真</label><br>
                <input type="file" id="photo" accept="image/*">
            </p>

            <button type="submit">投稿する</button>
        </form>

        <p id="message"></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="post.js"></script>

</body>
</html>
