
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メール認証</title>

  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

  <header>
    <h1>新潟大学 忘れ物・落とし物共有サイト</h1>
    <p>アカウント登録・ログイン</p>
  </header>
  
  <main class="auth-main">

    <a href="index.html">← トップページに戻る</a>

    <h2>ログイン・新規登録</h2>

    <form id="auth-form">
    <label for="email">メールアドレス</label>
    <input id="email" type="email" required>

    <br><br>

    <label for="password">パスワード（6文字以上）</label>
    <input id="password" type="password" minlength="6" required>

    <br><br>

    <button type="button" id="signup">新規登録</button>
    <button type="submit">ログイン</button>
  </form>

  <p id="message" role="status">メールアドレスを入力してください。</p>

  <section id="account" hidden>
    <h2>ログイン中</h2>
    <p id="user-email"></p>
    <button id="logout" type="button">ログアウト</button>
  </section>

  </main>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="mail.js"></script>
</body>
</html>
