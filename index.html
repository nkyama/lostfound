
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新潟大学 忘れ物・落とし物共有サイト</title>

  <!-- CSSを読み込む -->
  <link rel="stylesheet" href="style.css">


<style>
    body {
        visibility: hidden;
    }
</style>

</head>

<body>
  <header class="home-header">
    <h1>新潟大学 忘れ物・落とし物共有サイト</h1>
    <p>学内の落とし物情報を共有しよう</p>

    <div class="header-auth">
      <p id="login-status">ログイン状態を確認中...</p>
      <a href="mail.html" id="auth-link" class="login-button">
        ログイン・新規登録
      </a>
      <a href="chats.html" class="login-button">
        チャット一覧
      </a>
    </div>
  </header>
  
  <main>
    <h2>落とし物を探す</h2>
    
    
<input
    type="text"
    id="search-input"
    placeholder="キーワードを入力"
>
<button id="search-button">検索</button>
<button id="search-clear-button" type="button">クリア</button>


<div class="filter-area">

    <label for="category-filter">カテゴリ：</label>
    <select id="category-filter">
        <option value="">すべて</option>
    </select>

    <label for="sort-order">日付順：</label>
    <select id="sort-order">
        <option value="desc">新しい順</option>
        <option value="asc">古い順</option>
    </select>

</div>

    
<h2>新着の落とし物</h2>

<p id="posts-message" role="status"></p>
<div class="item-list" id="posts-list">
    投稿を読み込み中...
</div>
    
        
    <button onclick="location.href='post.html'">
      落とし物を投稿する
    </button>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="index.js"></script>
  <script src="style.js"></script>
  <script src="postout.js"></script>

</body>
</html>
